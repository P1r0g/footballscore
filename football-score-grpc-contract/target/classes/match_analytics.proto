syntax = "proto3";

option java_package = "edu.rutmiit.demo.grpc";
option java_multiple_files = true;

package matchanalytics;

service MatchAnalytics {

  rpc AnalyzeMatch
      (AnalyzeMatchRequest)
      returns (MatchAnalysisResponse);
}

message AnalyzeMatchRequest {

  int64 match_id = 1;

  string homeTeamName = 2;

  string awayTeamName = 3;

  int32 home_score = 4;

  int32 away_score = 5;
}

message MatchAnalysisResponse {

  int64 match_id = 1;

  string leader = 2;

  int32 goal_difference = 3;

}