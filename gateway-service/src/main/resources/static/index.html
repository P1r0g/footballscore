<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FootballScore</title>
  <style>
    body {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui;
    }

    button {
      padding: .6rem;
      margin: .3rem;
      cursor: pointer;
    }

    pre {
      padding: 1rem;
      background: #17212d;
      color: white;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<h1>FootballScore</h1>
<p>Войдите через Keycloak, затем выберите действие.</p>

<a href="/oauth2/authorization/keycloak">Войти через Keycloak</a>

<p>
  <button data-url="/bff/me">Текущий пользователь</button>
  <button data-url="/api/teams">Команды</button>
  <button data-url="/api/matches">Матчи</button>
</p>

<pre id="output">После входа нажмите кнопку.</pre>

<script>
  const output = document.getElementById('output');

  document.querySelectorAll('button[data-url]').forEach(button => {
    button.addEventListener('click', async () => {
      try {
        const response = await fetch(button.dataset.url, {
          credentials: 'same-origin'
        });

        const body = await response.text();
        output.textContent =
          button.dataset.url + '\n' + response.status + '\n' + body;
      } catch (error) {
        output.textContent = 'Ошибка запроса: ' + error.message;
      }
    });
  });
</script>
</body>
</html>
