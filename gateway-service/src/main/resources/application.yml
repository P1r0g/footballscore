server:
  port: ${SERVER_PORT:8088}
  reactive:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: gateway-service

  reactor:
    context-propagation: auto

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  session:
    timeout: 30m
    data:
      redis:
        namespace: footballscore:gateway:sessions

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8085/realms/footballscore
        registration:
          keycloak:
            provider: keycloak
            client-id: footballscore-bff
            client-secret: ${BFF_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,profile,email

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 500
            response-timeout: 3s
          routes:
            - id: footballscore-api
              uri: ${FOOTBALLSCORE_API_URL:http://localhost:8080}
              predicates:
                - Path=/api/teams,/api/teams/**,/api/matches,/api/matches/**,/api/audit,/api/audit/**
              filters:
                - TokenRelay=
management:
  otlp:
    metrics:
      export:
        enabled: false
  observations:
    enable:
      spring.security: false
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

logging:
  file:
    name: ${LOG_DIR:../runtime-logs}/gateway-service.log
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},trace_id=%X{traceId:-},span_id=%X{spanId:-},request_id=%X{requestId:-}] "