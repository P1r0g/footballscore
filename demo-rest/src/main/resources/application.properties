spring.application.name=demo-rest

# GraphiQL — интерактивная IDE для тестирования GraphQL-запросов.
# Доступна по адресу http://localhost:8080/graphiql после запуска приложения.
spring.graphql.graphiql.enabled=true

# Путь к GraphQL-endpoint
spring.graphql.path=/graphql

# Расположение GraphQL-схемы для Spring for GraphQL.
spring.graphql.schema.locations=classpath*:graphql/

# Расположение GraphQL-схемы для DGS.
# DGS использует свой собственный механизм поиска схемы, отдельный от Spring for GraphQL.
# По умолчанию: classpath*:schema/**/*.graphql* — нужно переопределить.
dgs.graphql.schema-locations=classpath*:graphql/**/*.graphqls

# Включаем интроспекцию схемы (удобно при разработке, отключите в продакшене)
spring.graphql.schema.introspection.enabled=true

# ─── RabbitMQ ────────────────────────────────────────────────────────
# Подключение к локальному брокеру (docker run rabbitmq:4-management)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/footballscore
spring.datasource.username=football
spring.datasource.password=football

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ????????? ??????
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# OAuth2: demo-rest calls audit-service
spring.security.oauth2.client.registration.audit-client.provider=keycloak
spring.security.oauth2.client.registration.audit-client.client-id=demo-rest-client
spring.security.oauth2.client.registration.audit-client.client-secret=${AUDIT_CLIENT_SECRET}
spring.security.oauth2.client.registration.audit-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.audit-client.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.keycloak.token-uri=http://127.0.0.1:8085/realms/footballscore/protocol/openid-connect/token

audit.service.base-url=http://127.0.0.1:8081