spring.application.name=demo-rest# GraphiQL — интерактивная IDE для тестирования GraphQL-запросов.# Доступна по адресу http://localhost:8080/graphiql после запуска приложения.spring.graphql.graphiql.enabled=true# Путь к GraphQL-endpointspring.graphql.path=/graphql# Расположение GraphQL-схемы для Spring for GraphQL.spring.graphql.schema.locations=class   path*:graphql/# Расположение GraphQL-схемы для DGS.# DGS использует свой собственный механизм поиска схемы, отдельный от Spring for GraphQL.# По умолчанию: classpath*:schema/**/*.graphql* — нужно переопределить.dgs.graphql.schema-locations=classpath*:graphql/**/*.graphqls# Включаем интроспекцию схемы (удобно при разработке, отключите в продакшене)spring.graphql.schema.introspection.enabled=true# ─── RabbitMQ ────────────────────────────────────────────────────────# Подключение к локальному брокеру (docker run rabbitmq:4-management)spring.rabbitmq.host=localhostspring.rabbitmq.port=5672spring.rabbitmq.username=guestspring.rabbitmq.password=guest# PostgreSQLspring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/football}spring.datasource.username=${DB_USERNAME:football}spring.datasource.password=${DB_PASSWORD:football}# JPAspring.jpa.open-in-view=falsespring.jpa.hibernate.ddl-auto=validate# Flywayspring.flyway.enabled=truespring.flyway.locations=classpath:db/migration