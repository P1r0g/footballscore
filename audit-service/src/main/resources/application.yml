spring:
  application:
    name: audit-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/footballscore
          jwk-set-uri: http://127.0.0.1:8085/realms/footballscore/protocol/openid-connect/certs
          audiences:
            - audit-service

  # ─── RabbitMQ ───────────────────────────────────────────────────────
  # Подключение к локальному брокеру (docker run rabbitmq:4-management)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

    # Наблюдаемость: Spring Boot передаёт trace-id из AMQP-заголовков в MDC логгера.
    # Это позволяет связать запрос в demo-rest с обработкой в audit-service.
    listener:
      simple:
        observation-enabled: true
        # Retry: при ошибке обработки повторить 3 раза с интервалом 2 секунды.
        # После исчерпания попыток сообщение уходит в DLQ (настроено в RabbitMQConfig).
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2.0

    template:
      observation-enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
  otlp:
    metrics:
      export:
        enabled: false
  observations:
    enable:
      spring.security: false
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

logging:
  file:
    name: ${LOG_DIR:../runtime-logs}/audit-service.log
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},trace_id=%X{traceId:-},span_id=%X{spanId:-},request_id=%X{requestId:-}] "
